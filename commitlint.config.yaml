# Commitlint configuration (non-executable YAML — deliberately not a .js file).
# Enforces Conventional Commit titles: type(scope): imperative subject.
# Self-contained rule set: no `extends`, so it works without extra packages.
rules:
  type-empty: [2, never]
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - refactor
      - test
      - chore
      - ci
      - build
      - perf
      - revert
  subject-empty: [2, never]
  scope-enum:
    - 2
    - always
    - - core
      - map
      - task
      - nav
      - ops
      - render
      - knowledge
      - gate
      - cli
      - ux
      - i18n
      - docs
      - release
      - changelog
      - codemap
      - router
      - benchmark
      - skills
      - templates
      - workflows
      - test
      - repo
      - verify
      - changes
      - roadmap
  subject-full-stop: [2, never, '.']
  subject-case:
    - 2
    - never
    - - sentence-case
      - start-case
      - pascal-case
      - upper-case
  header-max-length: [2, always, 72]
