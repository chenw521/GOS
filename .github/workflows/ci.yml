# CI for the GOS repository itself (GOS-specific; NOT rendered from
# templates/git/node masters — the node layer is exempt from the master-diff
# invariant, this repo keeps its own CI file). Never uses pull_request_target.
#
# Core trio per : gate (--audit: CI has no task state), sections
# regression, npm pack manifest integrity. Plus master-consistency (re-render
# the universal layer and require a zero diff), commitlint on PRs, and the
# aggregate-push guard on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — but only for pull_request events:
# private repos have a monthly Actions minute quota, rapid PR pushes should
# not burn it twice. Push-to-main runs are NEVER cancelled in progress: a
# newer push queues behind the running one, and the default single-pending
# semantics may cancel an older PENDING run — the skipped commit's own
# affected slice is then covered by no closeout (the surviving run's `before`
# base is the last ARRIVED head, not the last completed one); the invariant
# re-run in each closeout still covers every push whole-tree.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate (audit mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # the ai-trace shrink guard diffs the whitelist against origin/main;
          # the changelog obligation needs the push range and PR history too
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Changelog obligation base: push → HEAD^1 (the pushed range starts at
      # the previous main commit); pull_request → merge-base of the PR head
      # and the base branch head (never the merge ref). Exported for every
      # downstream gate step through GITHUB_ENV.
      - name: Resolve changelog obligation base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "push context: obligation base = HEAD^1"
            echo "GOS_CHANGELOG_BASE=HEAD^1" >> "$GITHUB_ENV"
          else
            git rev-parse --verify --quiet "$PR_HEAD_SHA^{commit}" >/dev/null \
              || git fetch -q origin "$PR_HEAD_SHA"
            mb="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            echo "pull_request context: obligation base = merge-base $mb"
            echo "GOS_CHANGELOG_BASE=$mb" >> "$GITHUB_ENV"
            echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
          fi
      - name: gos gate all --audit
        run: node bin/gos.cjs gate all --audit
      # Strict obligation check against the real PR head commit — the working
      # tree holds the merge ref, which must never satisfy the obligation.
      - name: changelog obligation vs PR head
        if: github.event_name == 'pull_request'
        run: node bin/gos.cjs gate changelog-obligation --base "$GOS_CHANGELOG_BASE" --head "$PR_HEAD_SHA"
      - name: changelog obligation vs pushed range
        if: github.event_name == 'push'
        run: node bin/gos.cjs gate changelog-obligation --base HEAD^1
      - name: Aggregate guard self-test
        run: bash test/checks/aggregate-guard.sh --self-test
      - name: stale-verb guard (command files × KNOWN_CASES)
        run: bash test/checks/stale-verbs.sh

      - name: ascii filename guard (tracked names pure ASCII)
        run: bash test/checks/ascii-filenames.sh

      - name: ai-trace whitelist shrink guard (tracker may only shrink)
        run: bash test/checks/ai-trace-shrink.sh

      - name: dogfood direct-require guard (T136 reaches the auto loop via the CLI only)
        run: bash test/checks/dogfood-no-require.sh --self-test

  # Main-push closeout (tiered CI): the heavy gos-map:none complement, the
  # merge-diff blast closure (affected subset against the previous main
  # head — whatever a PR tier skipped or an ungreen merge dodged still runs
  # here), and the invariant re-run. PR feedback lives in sections-pr.
  sections:
    name: Sections — main closeout (complement + merge-blast + invariants) (Node ${{ matrix.node-version }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # derived budget: install ~3 min + map:none complement family ~8-9 min +
    # merge-blast additivity (a wide merge touching heavily-linked files can
    # select a large anchored fraction, approaching full-suite wall time) —
    # the budget must accommodate it or legitimate wide merges false-red
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      # full history: the base resolve needs HEAD~1, a force-pushed-away
      # `before`, and merge-base — none reachable from a depth-1 checkout
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # sandbox engine for the auto sections: the bwrap tier assertions
      # (mask surface, mask-over-bind ordering) must run against the real
      # binary in CI, not only against probe stubs
      - name: Install sandbox engine (bubblewrap)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      # Previous-main-head base for the merge's own blast closure: the push
      # event's `before` field. A branch-creation push (before = 40×"0")
      # resolves to HEAD~1; an unreachable `before` (force-push,
      # platform-permitted until branch protection lands) falls back to
      # fetching the raw sha. Every resolve failure stays red (fail-closed).
      - name: Resolve previous main head (merge-diff base)
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "branch-creation push — base = HEAD~1"
            echo "GOS_MAIN_CLOSEOUT_BASE=HEAD~1" >> "$GITHUB_ENV"
          elif git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null; then
            echo "base = push event before ($PUSH_BEFORE)"
            echo "GOS_MAIN_CLOSEOUT_BASE=$PUSH_BEFORE" >> "$GITHUB_ENV"
          elif git fetch -q origin "$PUSH_BEFORE" \
            && git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null; then
            echo "force-pushed-away before — fetched raw sha, base = $PUSH_BEFORE"
            echo "GOS_MAIN_CLOSEOUT_BASE=$PUSH_BEFORE" >> "$GITHUB_ENV"
          else
            echo "::error::cannot resolve the push event's before sha as the closeout base"
            exit 1
          fi
      - name: Trust tracked custom gate (fresh checkout has no machine-local consent)
        run: node bin/gos.cjs gate trust check.sh
      - name: Section closeout suite
        run: |
          set -o pipefail
          bash test/run-sections.sh --tier main --base "$GOS_MAIN_CLOSEOUT_BASE" 2>&1 | tee "$RUNNER_TEMP/sections-log.txt"
      - name: Upload section log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sections-log-node${{ matrix.node-version }}
          path: ${{ runner.temp }}/sections-log.txt
          retention-days: 7

  # PR tier (tiered CI): the affected subset against the PR merge-base plus
  # the cheap whole-tree invariant sections and the unmarked map:none floor,
  # for minutes-level feedback. A green check here is an affected-subset
  # pass, never a full-suite pass — the main closeout carries the complement.
  sections-pr:
    name: Sections — PR tier (affected + invariants) (Node ${{ matrix.node-version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # derived budget: install ~3 min + invariants ~1-2 min + affected subset
    # + the unmarked map:none floor, with merge-blast additivity allowance
    # (a PR touching core hubs selects a large anchored fraction)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      # full history: the merge-base resolve needs the PR base branch head
      # and the head sha reachable — none guaranteed by a depth-1 checkout
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install sandbox engine (bubblewrap)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      # HARD GATE: a failed or missing merge-base resolve fails the job red —
      # never a silent fallback (verify-fetching only the head sha would leave
      # --base "" falling back to task_head/HEAD: empty diff, exit 0). A
      # resolved base with an empty diff is legitimately green (docs-only PR).
      - name: Resolve PR merge base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          git rev-parse --verify --quiet "$PR_HEAD_SHA^{commit}" >/dev/null \
            || git fetch -q origin "$PR_HEAD_SHA"
          mb="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          if [ -z "$mb" ]; then
            echo "::error::merge-base resolve returned empty — failing closed"
            exit 1
          fi
          echo "PR tier base = merge-base $mb"
          echo "GOS_PR_MERGE_BASE=$mb" >> "$GITHUB_ENV"
      - name: Trust tracked custom gate (fresh checkout has no machine-local consent)
        run: node bin/gos.cjs gate trust check.sh
      - name: Section PR-tier suite
        run: |
          set -o pipefail
          bash test/run-sections.sh --tier pr --base "$GOS_PR_MERGE_BASE" 2>&1 | tee "$RUNNER_TEMP/sections-log.txt"
      - name: Upload section log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sections-pr-log-node${{ matrix.node-version }}
          path: ${{ runner.temp }}/sections-log.txt
          retention-days: 7

  pack:
    name: npm pack manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pack manifest integrity
        run: |
          bash test/pack-check.sh

  masters:
    name: Template master consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Re-render universal layer
        run: node bin/gos.cjs init git --render-self
      - name: Workflow files parse as YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'workflow YAML: {len(glob.glob(".github/workflows/*.yml"))} file(s) parse clean')
          PY
      - name: Diff must be empty (node layer exempt)
        run: |
          git diff --exit-code -- \
            .github/CODEOWNERS \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/PULL_REQUEST_TEMPLATE.md \
            commitlint.config.yaml

  commitlint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint PR commit range
        if: github.event_name == 'pull_request'
        run: |
          npx --yes commitlint@19 --config commitlint.config.yaml \
            --from origin/main --to HEAD
      - name: Lint push range (aggregates are commit messages too)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "branch creation push — nothing to lint"; exit 0
          fi
          git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null \
            || git fetch -q origin "$PUSH_BEFORE" || true
          bash test/checks/push-lint-squash.sh "$PUSH_BEFORE" "$PUSH_AFTER"
      - name: Subject charset policy (ASCII-only)
        if: github.event_name == 'pull_request'
        run: bash test/checks/commitlint-charset.sh
      - name: Aggregate push guard (push range discipline)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          args=()
          if [ "$PUSH_FORCED" = "true" ]; then args+=(--forced); fi
          # a force push may leave BEFORE unreachable from any ref; fetch the
          # raw sha so the guard can resolve it
          git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null \
            || git fetch origin "$PUSH_BEFORE"
          bash test/checks/aggregate-guard.sh "${args[@]}" "$PUSH_BEFORE" "$PUSH_AFTER"

  # A3 (2026-10-20): main is PR-only while branch protection waits for the
  # public/Pro gate. PR squash-merges carry committer GitHub <noreply@github.com>
  # (web-flow creates the merge commit); local direct pushes carry the user.
  # This alarm is the visibility backstop for the local pre-push ban.
  direct-push-alarm:
    name: Direct push discipline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Committer must be GitHub (PR merges only)
        run: |
          committer="$(git log -1 --format='%cn <%ce>' '${{ github.event.after }}')"
          echo "HEAD committer: ${committer}"
          # case patterns cannot carry literal < > (parse-level redirection
          # tokens) — grep is the portable discriminator
          if printf '%s' "$committer" | grep -qi '^GitHub *<noreply@github\.com>$'; then
            echo "PR squash-merge detected — discipline holds"
          else
            echo "::error::direct push to main detected (committer: ${committer}) — use the PR flow: raw-push a feature branch, open a PR, squash-merge; local emergency bypass: GOS_ALLOW_MAIN_PUSH=1"
            exit 1
          fi
